name: publish
on:
  schedule:
    - cron: "23 * * * *"     # hourly safety net
  workflow_dispatch: {}
  workflow_run:
    workflows: ["watch"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: pages-publish
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: find latest successful watch run
        id: prev
        continue-on-error: true
        run: |
          RID=$(gh api "repos/${{ github.repository }}/actions/workflows/watch.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion=="success")][0].id // ""')
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
      - name: fetch fragments
        if: steps.prev.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "frag-*"
          path: frags/
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev.outputs.run_id }}
      - name: push to gh-pages
        run: |
          git config user.name "sniper-bot"
          git config user.email "sniper-bot@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          git switch gh-pages 2>/dev/null || git switch --orphan gh-pages
          rm -f shard_*.data.js index.html
          cp docs/index.html .
          ls frags/*.data.js >/dev/null 2>&1 && cp frags/shard_*.data.js . || echo "no fragments yet"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "publish latest radar data"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          fi
