name: publish
# Deploys the panel itself. Findings do NOT come through here any more - each
# shard force-pushes its own feed-<n> branch and the panel fetches those live,
# so a find never waits on a Pages build. This only runs when the panel HTML
# changes (plus a daily safety net).
on:
  push:
    branches: [main]
    paths: ["docs/index.html"]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pages-publish
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: push panel to gh-pages
        run: |
          git config user.name "sniper-bot"
          git config user.email "sniper-bot@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git switch -C gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi
          # legacy per-shard fragments: the panel reads the feed branches now
          rm -rf shard_*.data.js frags index.html
          # Deliberately the CURRENT tip of main, not the sha that triggered
          # this run. A run can sit queued for hours (GitHub incidents do
          # happen), and publishing a stale panel over a newer one is worse
          # than publishing nothing.
          git fetch --depth 1 origin main
          git show FETCH_HEAD:docs/index.html > index.html
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "panel unchanged"
          else
            git commit -m "publish panel"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          fi
