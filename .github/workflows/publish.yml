name: publish
# Deploys the panel itself. Findings do NOT come through here any more - each
# shard force-pushes its own feed-<n> branch and the panel fetches those live,
# so a find never waits on a Pages build. This only runs when the panel HTML
# changes (plus a daily safety net and manual dispatch).
# Deployed via the Actions deploy-pages pipeline; the legacy gh-pages builder
# fails instantly on this repo ("Page build failed"), so this is the reliable
# path.
on:
  push:
    branches: [main]
    paths: ["docs/index.html"]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: prepare panel artifact
        run: |
          # Deliberately the CURRENT tip of main, not the sha that triggered
          # this run. A run can sit queued for hours (GitHub incidents do
          # happen), and publishing a stale panel over a newer one is worse
          # than publishing nothing.
          git fetch --depth 1 origin main
          mkdir -p dist
          git show FETCH_HEAD:docs/index.html > dist/index.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
